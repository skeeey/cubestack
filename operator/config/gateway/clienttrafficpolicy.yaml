# The ClientTrafficPolicy that makes the platform Gateway usable for Agent
# Router traffic (design D8): a connection buffer large enough for the
# request-body translation every AI request goes through — it buffers the whole
# body to read the model name out of it, which the CRD's own 32KiB default is
# too small for — and the HTTP/2 flow-control windows restored to Envoy's
# native values, above the CRD's defaults. It is a prerequisite of the Agent
# Router path, so it ships with the Gateway and shares its lifecycle.
#
# Like the Gateway's, the metadata.name below is deliberately unprefixed here
# and becomes cubestack-gateway-ai via the namePrefix in config/default. The
# targetRefs name is not prefixed for us — kustomize rewrites name references
# only for types it knows, and ClientTrafficPolicy is not one of them — so it
# carries the final name of the Gateway it attaches to.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gateway-ai
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cubestack-gateway
  connection:
    bufferLimit: 50Mi
  http2:
    initialStreamWindowSize: 16Mi
    initialConnectionWindowSize: 24Mi
