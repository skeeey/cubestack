name: CI Operator Chart

# Push-only so the chart publish job never appears in pull request checks —
# same as the operator image workflow. The chart's static content (templates/,
# crds/) is generated from config/ by hack/update-helm-resources.sh, so this
# workflow triggers only on chart-relevant paths: helm/ is the packaged
# content, config/ and hack/ are its generator inputs, and the Makefile owns
# the regenerate/package targets. Everything else under operator/ is covered
# by the image and CI workflows.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-operator-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            chart:
              - 'operator/helm/**'
              - 'operator/config/**'
              - 'operator/hack/**'
              - 'operator/Makefile'

  build-push-chart:
    # Publish the chart as an OCI artifact only when a merge lands on main
    # with chart-content-relevant changes.
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: operator/go.mod
      # Package via the make target: it regenerates the chart from config/ at
      # HEAD first (helm-resources-update dependency) so the pushed artifact
      # always matches the committed sources — the generator fails loudly on
      # errors — and drops any stale tgz before packaging. The tgz lands next
      # to the chart (helm/cubestack-operator-chart/cubestack-operator-chart-<version>.tgz).
      - name: Package the chart
        working-directory: operator
        run: make helm-package
      # helm is preinstalled on ubuntu-24.04 runners — no install step needed.
      - name: Log in to Harbor (helm registry)
        working-directory: operator
        run: |
          set -euo pipefail
          # Single-quote the credentials: Harbor robot account names contain a
          # literal '$' (robot$<name>) that double quotes would let the shell
          # expand ($ci → unbound variable under set -u).
          helm registry login harbor.isuanova.com \
            -u '${{ vars.CI_BOT_NAME }}' -p '${{ secrets.CI_BOT_PASSWORD }}'
      # Push the packaged chart as an OCI artifact. The OCI repository name is
      # deliberately the chart name (cubestack-operator-chart): Harbor serves
      # chart-OCI and image artifacts under the same repo name within a
      # project, so the chart repo is suffixed -chart to avoid colliding with
      # the container image repository cubestack-operator in project suanova.
      - name: Push chart to Harbor
        working-directory: operator
        run: |
          set -euo pipefail
          # The OCI version tag is the Chart.yaml version — derive the tgz
          # name from it so a version bump needs no workflow edit.
          CHART_VERSION="$(helm show chart helm/cubestack-operator-chart | awk '/^version:/{print $2}')"
          helm push "helm/cubestack-operator-chart/cubestack-operator-chart-${CHART_VERSION}.tgz" \
            oci://harbor.isuanova.com/suanova
